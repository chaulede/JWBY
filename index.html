            if (!confirm(`确定要移除白板上全部标注吗？\n\n将移除：\n· 拼音标注 ${pinyinNodes.length} 处\n· 翻译标注 ${transNodes.length} 处\n\n（文字本身会保留，其他手写内容和图片不受影响）`)) {
                return;
            }

            saveHistoryImmediate();

            whiteboardEl.querySelectorAll('ruby').forEach(ruby => {
                let txt = '';
                ruby.childNodes.forEach(c => {
                    if (c.nodeType === Node.TEXT_NODE) txt += c.textContent;
                    else if (c.tagName && c.tagName.toLowerCase() !== 'rt') txt += c.textContent;
                });
                ruby.replaceWith(document.createTextNode(txt));
            });

            whiteboardEl.querySelectorAll('.pinyin-inline-table').forEach(tbl => {
                const firstRow = tbl.querySelector('tr');
                let txt = '';
                if (firstRow) {
                    firstRow.querySelectorAll('td').forEach(td => {
                        const bottom = td.querySelector('.py-bottom');
                        txt += bottom ? bottom.textContent : td.textContent;
                    });
                } else {
                    txt = tbl.textContent;
                }
                tbl.replaceWith(document.createTextNode(txt));
            });

            whiteboardEl.querySelectorAll('.english-line').forEach(node => node.remove());

            whiteboardEl.querySelectorAll('div').forEach(div => {
                if (!div.textContent.trim() && div.querySelectorAll('img, table, ruby, .core-vocab').length === 0) {
                    if (div.children.length === 0 || (div.children.length === 1 && div.children[0].tagName === 'BR')) {
                        div.remove();
                    }
                }
            });

            saveHistoryImmediate();
            setTimeout(resizeCanvas, 100);
            alert('✅ 已清除白板上所有拼音和翻译标注（文字内容已保留，可通过“撤销”恢复）。');
        });

        document.getElementById('btnClozeTest').addEventListener('click', function() {
            const originalNodes = whiteboard.querySelectorAll('.core-vocab');
            if (originalNodes.length === 0) {
                alert('请先用鼠标选中文章中的字词，点击“U 标注核心词汇”，然后再来生成挖空试题！');
                return;
            }

            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = whiteboard.innerHTML;
            
            const clonedVocabs = tempDiv.querySelectorAll('.core-vocab');
            const wordBank = new Set();
            let blankIndex = 1;

            clonedVocabs.forEach(node => {
                const text = node.textContent.trim();
                if (text) {
                    wordBank.add(text);
                    const blankSpan = document.createElement('span');
                    blankSpan.style.cssText = 'display:inline-block; min-width:60px; border-bottom:2px solid #1e293b; text-align:center; font-weight:bold; color:#3b82f6;';
                    blankSpan.textContent = `(${blankIndex})`;
                    node.replaceWith(blankSpan);
                    blankIndex++;
                }
            });

            const wordBankArray = Array.from(wordBank).sort(() => Math.random() - 0.5);
            const wordBankHtml = wordBankArray.map((w, i) => `${String.fromCharCode(65 + i)}. ${w}`).join(' &nbsp;&nbsp;&nbsp; ');

            let finalHtml = `<hr style="border: 1px dashed #cbd5e1; margin: 40px 0;"><br>`;
            finalHtml += `<div class="quiz-board">`;
            finalHtml += `<h2>✂️ 短文挖空练习 (Cloze Test)</h2>`;
            finalHtml += `<div style="background:#f8fafc; border:1px solid #cbd5e1; padding:12px 16px; border-radius:8px; margin-bottom:20px; font-family:'Arial', sans-serif; font-size:1.1em; color:#1e293b; font-weight:bold;">`;
            finalHtml += `<span style="color:#1d4ed8; margin-right:10px;">【备选词库】</span> ${wordBankHtml}`;
            finalHtml += `</div>`;
            finalHtml += `<div style="line-height: 2; padding: 10px; font-size: 1.1em;">${tempDiv.innerHTML}</div>`;
            finalHtml += BOARD_EXPORT_BAR_HTML;
            finalHtml += `</div>`;

            whiteboard.innerHTML += finalHtml;
            scrollContainer.scrollTo({ top: scrollContainer.scrollHeight, behavior: 'smooth' });
            setTimeout(() => { saveHistoryImmediate(); resizeCanvas(); }, 250);
        });

        // ================= 新增：看拼音写汉字 / 补全汉字 试题 =================
        const EXAM_START_NO = 1; // 补全汉字题的起始题号（想从 51 开始就改成 51）

        // 取白板的干净课文：去掉拼音、翻译、旧试题
        function getCleanBoardText() {
            const clone = whiteboard.cloneNode(true);
            clone.querySelectorAll('rt, .py-top, .english-line, .wp-exam, .quiz-board').forEach(n => n.remove());
            clone.querySelectorAll('br, p, div, li, h1, h2, h3, tr').forEach(el => el.after(document.createTextNode('\n')));
            return clone.textContent.replace(/\u200B/g, '').replace(/\n{3,}/g, '\n\n').trim();
        }

        // 词汇来源：指定词汇（完整保留用户输入的所有字、词，不限制数量、不做截断） > 白板核心词汇 > 交给 AI 从课文里挑
        function getExamVocabList() {
            const custom = (document.getElementById('examVocabInput').value || '')
                .split(/[\s,，、;；\n\-—]+/).map(s => s.trim()).filter(Boolean);
            if (custom.length) return custom;
            return getCoreVocabularies();
        }

        function parseAIJson(text) {
            const t = String(text).replace(/```json|```/gi, '').trim();
            const s = t.indexOf('{'), e = t.lastIndexOf('}');
            if (s === -1 || e === -1) throw new Error('AI 没有返回有效数据，请重试。');
            return JSON.parse(t.slice(s, e + 1));
        }

        // 本地生成拼音（与文字一一对应，非汉字返回空串）
        function getPinyinArray(text) {
            const chars = Array.from(text);
            let arr = null;
            try {
                if (typeof window.pinyinPro !== 'undefined') {
                    const r = window.pinyinPro.pinyin(text, { toneType: 'symbol', type: 'array' });
                    if (Array.isArray(r) && r.length === chars.length) arr = r;
                }
            } catch (e) { arr = null; }
            return chars.map((ch, i) => {
                if (!/[\u4e00-\u9fa5]/.test(ch)) return '';
                if (arr) return arr[i];
                return (typeof window.pinyinPro !== 'undefined') ? window.pinyinPro.pinyin(ch, { toneType: 'symbol' }) : '';
            });
        }

        function appendExamToBoard(innerHtml) {
            let html = '';
            if (whiteboard.innerText.trim() !== '' && whiteboard.innerHTML !== '<p><br></p>') {
                html += `<hr style="border: 1px dashed #cbd5e1; margin: 40px 0;"><br>`;
            }
            html += innerHtml;
            whiteboard.innerHTML += html;
            setTimeout(() => {
                const all = whiteboard.querySelectorAll('.wp-exam');
                if (all.length) all[all.length - 1].scrollIntoView({ behavior: 'smooth', block: 'start' });
                saveHistoryImmediate();
                resizeCanvas();
            }, 50);
        }

        async function withExamLoading(btn, msg, task) {
            const originalText = btn.innerHTML;
            btn.innerHTML = `<span class="loader"></span> 正在出题...`;
            btn.disabled = true;
            loadingOverlay.classList.remove('hidden');
            loadingText.innerText = msg;
            try { await task(); }
            catch (e) { alert('生成失败：' + e.message); }
            finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
                loadingOverlay.classList.add('hidden');
            }
        }

        const ANSWER_TOGGLE = `<div class="wp-answer-toggle wp-no-export" contenteditable="false" onclick="var n=this.parentElement.querySelector('.wp-answer');if(n)n.style.display=(n.style.display==='none'?'block':'none');">👁 显示 / 隐藏答案</div>` + BOARD_EXPORT_BAR_HTML;

        // ---------- 试题 1：看拼音写汉字 ----------
        function buildWritePinyinHtml(items) {
            let html = `<div class="wp-exam">`;
            html += `<h2>✍️ 看拼音，写汉字 (Write the Characters)</h2>`;
            html += `<div class="wp-tip">Write the Chinese characters for the pinyin in the boxes. The English in brackets tells you the meaning.</div>`;
            const answers = [];

            items.forEach((it, idx) => {
                const chars = it.sentence.split('');
                const py = getPinyinArray(it.sentence);
                const flags = new Array(chars.length).fill(false);
                const enAfter = {};
                let cursor = 0;
                const ans = [];
                it.blanks.forEach(b => {
                    let p = it.sentence.indexOf(b.text, cursor);
                    if (p === -1) p = it.sentence.indexOf(b.text);
                    if (p === -1) return;
                    for (let k = p; k < p + b.text.length; k++) flags[k] = true;
                    enAfter[p + b.text.length - 1] = b.en;
                    cursor = p + b.text.length;
                    ans.push(b.text);
                });
                answers.push(`${idx + 1}. ${ans.join('、')}`);

                let line = '';
                chars.forEach((ch, i) => {
                    if (flags[i]) {
                        line += `<span class="wp-cell wp-blank"><span class="wp-py">${escapeHtml(py[i] || '')}</span><span class="wp-zi">&nbsp;</span></span>`;
                    } else {
                        line += `<span class="wp-cell"><span class="wp-py">${escapeHtml(py[i] || '')}</span><span class="wp-zi">${escapeHtml(ch)}</span></span>`;
                    }
                    if (enAfter[i] !== undefined) {
                        line += `<span class="wp-en">(${escapeHtml(enAfter[i])})</span>`;
                    }
                });
                html += `<div class="wp-item"><span class="wp-no">${idx + 1}.</span><div class="wp-line">${line}</div></div>`;
            });

            html += ANSWER_TOGGLE;
            html += `<div class="wp-answer" style="display:none;">参考答案：<br>${answers.map(escapeHtml).join('<br>')}</div>`;
            html += `</div>`;
            return html;
        }

        document.getElementById('btnWritePinyin').addEventListener('click', function() {
            const apiKey = apiKeyInput.value.trim();
            const corpus = getCleanBoardText().slice(0, 6000);
            const list = getExamVocabList();
            if (!corpus && list.length === 0) { alert('白板为空，也没有指定词汇！请先在白板输入课文，或在“指定词汇”框里填写词汇。'); return; }
            if (!apiKey) { alert('必须填入 API Key！'); return; }

            withExamLoading(this, 'AI 正在生成“看拼音写汉字”试题...', async () => {
                const batches = list.length ? [] : [null];
                for (let i = 0; i < list.length; i += 8) batches.push(list.slice(i, i + 8));

                const allItems = [];

                for (let bIdx = 0; bIdx < batches.length; bIdx++) {
                    const batch = batches[bIdx];
                    if (batches.length > 1) {
                        loadingText.innerText = `AI 正在生成“看拼音写汉字”试题（第 ${bIdx + 1}/${batches.length} 批）...`;
                    }
                    const vocabPart = batch
                        ? `【本次考查词汇（共 ${batch.length} 个，全部必须出题，不得遗漏或跳过）】\n${batch.join('、')}\n严格按顺序为这 ${batch.length} 个词汇各出一道题，共 ${batch.length} 道。请原样保留词汇中的简体或繁体字形，不要擅自转换繁简体。`
                        : `【本次考查词汇】用户没有指定，请从课文语料中挑选出所有重要的核心词语（不限制题数，保留原文繁简体字形），每个词语出一道题。`;

                    const prompt = `你是一位国际中文教师，要出一份“看拼音，写汉字”的练习题：句子中的某个词语被挖空，学生根据拼音写出汉字。
${vocabPart}

【课文语料】
${corpus || '（无课文，请根据词汇编写简单句子）'}

【出题规则】
1. 优先从【课文语料】中选取包含该词汇的原句（句子太长时截取完整的短句）；语料里没有该词时，写一个符合本课难度、简短自然的句子（句子字形风格与该词汇保持一致，词汇是繁体句子也用繁体，词汇是简体句子也用简体）。
2. blanks 里的 text 必须是 sentence 中原样出现的连续汉字，也就是要学生默写的词语。每题通常 1 个空。
3. en 是该词语简短的英文释义（2~4 个词）。
4. sentence 里不要放拼音，也不要放英文。
5. 只输出 JSON，不要任何解释，格式如下：
{"items":[{"sentence":"我喜欢喝茶。","blanks":[{"text":"喜欢","en":"to like"}]}]}`;

                    const raw = await callAI(prompt, '你是一个专业的国际中文命题专家。只输出 JSON。', null, false);
                    const data = parseAIJson(raw);
                    (data.items || []).forEach(it => {
                        const sentence = String((it && it.sentence) || '').trim();
                        const blanks = (Array.isArray(it && it.blanks) ? it.blanks : [])
                            .map(b => ({ text: String((b && b.text) || '').trim(), en: String((b && b.en) || '').trim() }))
                            .filter(b => b.text && sentence.includes(b.text));
                        if (!sentence || !blanks.length) return;
                        allItems.push({ sentence, blanks });
                    });
                }

                if (!allItems.length) throw new Error('AI 返回的题目格式不对，请重试一次。');
                appendExamToBoard(buildWritePinyinHtml(allItems));
            });
        });

        // ---------- 试题 2：补全汉字（选部件） ----------
        function buildGridGroup(word, py, charIdx, visible, position, complete) {
            const chars = Array.from(word);
            const mi = (document.getElementById('radicalGridType') || {}).value === 'mi';
            let h = '<span class="wp-ggrp">';
            chars.forEach((ch, i) => {
                let inner;
                if (i === charIdx && !complete) {
                    let pos = ['left', 'right', 'top', 'bottom', 'natural', 'enc-l', 'enc-r'].includes(position) ? position : 'natural';
                    if (typeof NATURAL_FORMS !== 'undefined' && NATURAL_FORMS.has(visible)) pos = 'natural';
                    inner = `<span class="wp-part p-${pos}"><span class="wp-gg">${escapeHtml(visible)}</span></span>`;
                } else {
                    inner = `<span class="wp-gg">${escapeHtml(ch)}</span>`;
                }
                h += `<span class="wp-gcell"><span class="wp-gpy"><span>${escapeHtml(py[i] || '')}</span></span><span class="wp-gch${mi ? ' mi' : ''}">${inner}</span></span>`;
            });
            return h + '</span>';
        }

            return { word, idx, pc: d.pc, visible: d.visible, missing: d.missing, position: POS_NAME[d.pc] || 'natural', en: en || '' };
        }
        // 一个词里“每一个”能拆的字都出题
        function radicalItemsForWord(word, en) {
            const out = [];
            Array.from(word).forEach((ch, i) => { const it = makeRadicalItem(word, i, en); if (it) out.push(it); });
            return out;
        }
        function glyphMissing(ch) {
            try {
                const c = document.createElement('canvas'); c.width = c.height = 48;
                const x = c.getContext('2d');
                const draw = s => { x.clearRect(0, 0, 48, 48); x.font = '40px ' + RADICAL_FONT; x.textBaseline = 'top'; x.fillText(s, 2, 2);
                    const d = x.getImageData(0, 0, 48, 48).data; let h = ''; for (let i = 3; i < d.length; i += 4) h += d[i] > 0 ? '1' : '0'; return h; };
                return draw(ch) === draw('\u{10FFFD}');
            } catch (e) { return false; }
        }

        // ================= 繁簡轉換（OpenCC-js，按需載入） =================
        let openccPromise = null;
        function ensureOpenCC() {
            if (window.OpenCC) return Promise.resolve(true);
            if (openccPromise) return openccPromise;
            const urls = [
                'https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js',
                'https://unpkg.com/opencc-js@1.0.5/dist/umd/full.js'
            ];
            openccPromise = (async () => {
                for (const u of urls) {
                    const ok = await new Promise(res => {
                        const s = document.createElement('script');
                        s.src = u;
                        s.onload = () => res(!!window.OpenCC);
                        s.onerror = () => res(false);
                        document.head.appendChild(s);
                    });
                    if (ok) return true;
                }
                return false;
            })();
            openccPromise.then(ok => { if (!ok) openccPromise = null; });
            return openccPromise;
        }

        const converterCache = {};
        function getConverter(mode) {
            if (!converterCache[mode]) {
                converterCache[mode] = (mode === 's2t')
                    ? window.OpenCC.Converter({ from: 'cn', to: 'tw' })
                    : window.OpenCC.Converter({ from: 'tw', to: 'cn' });
            }
            return converterCache[mode];
        }

        async function convertBoard(mode) {
            // 先記下當前選區（載入組件是異步的）
            let range = null;
            const sel = window.getSelection();
            if (sel && sel.rangeCount && !sel.isCollapsed) {
                const r = sel.getRangeAt(0);
                if (whiteboard.contains(r.commonAncestorContainer)) range = r.cloneRange();
            }
            if (!range && !confirm('未選中文字，將轉換整個白板的內容。\n（拼音、圖片、格式不受影響，可通過「撤銷」恢復）\n\n是否繼續？')) return;

            const ok = await ensureOpenCC();
            if (!ok) { alert('繁簡轉換組件載入失敗，請檢查網絡（需能訪問 cdn.jsdelivr.net 或 unpkg.com）後重試。'); return; }
            const conv = getConverter(mode);

            saveHistoryImmediate();
            let changed = 0;

            if (range) {
                getRangeTextParts(range).forEach(p => {
                    const el = p.node.parentElement;
                    if (!el || el.closest('rt, .py-top')) return;
                    const v = p.node.nodeValue;
                    const nv = v.slice(0, p.s) + conv(v.slice(p.s, p.e)) + v.slice(p.e);
                    if (nv !== v) { p.node.nodeValue = nv; changed++; }
                });
            } else {
                const walker = document.createTreeWalker(whiteboard, NodeFilter.SHOW_TEXT);
                const nodes = [];
                let n;
                while ((n = walker.nextNode())) {
                    const el = n.parentElement;
                    if (el && el.closest('rt, .py-top')) continue;
                    nodes.push(n);
                }
                nodes.forEach(t => {
                    const v = t.nodeValue;
                    const nv = conv(v);
                    if (nv !== v) { t.nodeValue = nv; changed++; }
                });
            }

            saveHistoryImmediate();
            setTimeout(resizeCanvas, 100);
            if (!changed) alert(mode === 's2t' ? '沒有需要轉換的簡體字。' : '沒有需要轉換的繁體字。');
        }

        document.getElementById('btnS2T').addEventListener('click', () => convertBoard('s2t'));
        document.getElementById('btnT2S').addEventListener('click', () => convertBoard('t2s'));

        // ================= 補全漢字（繁体优先：本地字典拆字，能拆的全部出题；AI 只给英文释义） =================
        document.getElementById('btnRadicalExam').addEventListener('click', function() {
            const apiKey = apiKeyInput.value.trim();
            const corpus = getCleanBoardText().slice(0, 6000);
            const list = getExamVocabList();
            if (!corpus && list.length === 0) { alert('白板为空，也没有指定词汇！请先在白板输入课文，或在“指定词汇”框里填写词汇。'); return; }
            if (!apiKey) { alert('必须填入 API Key！'); return; }

            withExamLoading(this, 'AI 正在整理词语释义...', async () => {
                const gloss = new Map();
                let words = list.slice();

                if (words.length) {
                    // 有指定词汇：AI 只给英文释义，分批 20 个
                    for (let i = 0; i < words.length; i += 20) {
                        const batch = words.slice(i, i + 20);
                        if (words.length > 20) loadingText.innerText = `AI 正在整理词语释义（第 ${Math.floor(i / 20) + 1}/${Math.ceil(words.length / 20)} 批）...`;
                        const prompt = `给下面每个词语一个简短英文释义（2~4 个词）。word 必须与输入一字不差，原样保留简体或繁体字形，不要转换。\n词语：${batch.join('、')}\n只输出 JSON：{"items":[{"word":"頭痛","en":"headache"}]}`;
                        try {
                            const data = parseAIJson(await callAI(prompt, '你是国际中文教师。只输出 JSON。', null, false));
                            (data.items || []).forEach(o => { if (o && o.word) gloss.set(String(o.word).trim(), String(o.en || '').trim()); });
                        } catch (e) { console.warn('释义获取失败，英文释义留空', e); }
                    }
                } else {
                    // 没有指定词汇：AI 从课文里挑词（只挑词，拆字交给本地字典）
                    const prompt = `从【课文语料】中挑出所有适合做“补全汉字”练习的词语或单字（每项 1~4 个字，尽量多，最多 60 项），并给简短英文释义。word 必须是课文里原样出现的字形（简体或繁体），不要转换。\n【课文语料】\n${corpus}\n只输出 JSON：{"items":[{"word":"頭痛","en":"headache"}]}`;
                    const data = parseAIJson(await callAI(prompt, '你是国际中文教师。只输出 JSON。', null, false));
                    (data.items || []).forEach(o => {
                        const w = String((o && o.word) || '').trim();
                        if (w && !gloss.has(w)) { gloss.set(w, String(o.en || '').trim()); words.push(w); }
                    });
                }

                const ex = makeRadicalItem('什麽', 0, 'what');
                const seen = new Set();
                const items = [];
                words.forEach(w => radicalItemsForWord(w, gloss.get(w) || '').forEach(it => {
                    const k = it.word + '#' + it.idx;
                    if (!seen.has(k)) { seen.add(k); items.push(it); }
                }));
                if (!items.length) throw new Error('这些词里没有收录拆解的合体字（独体字或生僻字会自动跳过）。请换一些词再试。');

                // 选项：所有答案部件 + 干扰部件（干扰项不能与题中显示的部件拼成真字）
                const missingSet = [];
                [ex].concat(items).forEach(o => { if (!missingSet.includes(o.missing)) missingSet.push(o.missing); });
                const POOL = Array.from('口子馬十火寸古青貝見立日木兌又己文方反力石田車女心手').sort(() => Math.random() - 0.5);
                const okDistractor = c => !missingSet.includes(c) && [ex].concat(items).every(o => o.visible !== c && !TRAD_PAIRS.has(o.pc + o.visible + c));
                const total = Math.max(6, missingSet.length);
                const extras = POOL.filter(okDistractor).slice(0, Math.max(0, total - missingSet.length));
                const opts = missingSet.concat(extras).sort(() => Math.random() - 0.5);
                const letter = c => String.fromCharCode(65 + opts.indexOf(c));

                let html = `<div class="wp-exam" lang="zh-Hant">`;
                html += `<h2>🧩 補全漢字 (Complete the Characters)</h2>`;
                html += `<div class="wp-tip">Choose the correct component from A–${String.fromCharCode(64 + opts.length)} to complete each character, and write the letter in the box.</div>`;
                html += `<div class="wp-opts">${opts.map((c, i) => `<span><b>${String.fromCharCode(65 + i)}</b>${escapeHtml(c)}</span>`).join('')}</div>`;

                if (ex) {
                    const py = getPinyinArray(ex.word);
                    html += `<div class="wp-ex-label">例如：</div>`;
                    html += `<div class="wp-gitem"><div class="wp-gleft"><span class="wp-gcol">${buildGridGroup(ex.word, py, ex.idx, ex.visible, ex.position, false)}<span class="wp-gen">${escapeHtml(ex.en)}</span></span><span class="wp-arrow"></span>${buildGridGroup(ex.word, py, ex.idx, ex.visible, ex.position, true)}</div><div class="wp-abox">${letter(ex.missing)}</div></div>`;
                }

                const answers = [];
                items.forEach((o, i) => {
                    const no = EXAM_START_NO + i;
                    const py = getPinyinArray(o.word);
                    answers.push(`${no}. ${letter(o.missing)}（${o.missing}）— ${Array.from(o.word)[o.idx]}（${o.visible}＋${o.missing}）${o.word}`);
                    html += `<div class="wp-gitem"><div class="wp-gleft"><span class="wp-no">${no}.</span><span class="wp-gcol">${buildGridGroup(o.word, py, o.idx, o.visible, o.position, false)}<span class="wp-gen">${escapeHtml(o.en)}</span></span></div><div class="wp-abox"></div></div>`;
                });

                html += ANSWER_TOGGLE;
                html += `<div class="wp-answer" style="display:none;">参考答案：<br>${answers.map(escapeHtml).join('<br>')}</div>`;
                html += `</div>`;
                appendExamToBoard(html);

                // 字体检查：缺字形时提醒，而不是悄悄换成别的字（例如把 ⺮ 换成 竹）
                const shown = new Set(); [ex].concat(items).forEach(o => { shown.add(o.visible); shown.add(o.missing); });
                const lack = Array.from(shown).filter(glyphMissing);
                if (lack.length) alert('当前电脑的字体里没有这些偏旁的字形：' + lack.join(' ') + '\n\n请安装「思源宋体 TC / Noto Serif CJK TC」或「新細明體 MingLiU」后刷新页面，否则它们会显示成方框。');
            });
        });
    }

    window.clearPptFromBoard = function() {
        const whiteboard = document.getElementById('whiteboardContent');
        const pptNodes = whiteboard.querySelectorAll('.pptx-import');
        
        if (pptNodes.length === 0) {
            alert('白板上没有可清除的 PPT 内容。');
            return;
        }
        
        if (!confirm(`确定要从白板删除全部 ${pptNodes.length} 页 PPT 内容吗？\n（老师手写的其他内容会保留）`)) {
            return;
        }
        
        pptNodes.forEach(node => {
            let prev = node.previousSibling;
            while (prev && prev.nodeType === Node.TEXT_NODE && !prev.textContent.trim()) {
                prev = prev.previousSibling;
            }
            if (prev && prev.tagName === 'HR') {
                const beforeHr = prev.previousSibling;
                prev.remove();
                if (beforeHr && beforeHr.nodeName === 'BR') beforeHr.remove();
            }
            node.remove();
        });
        
        const fileInput = document.getElementById('docFileUpload');
        const fileNameEl = document.getElementById('docFileName');
        if (fileInput) fileInput.value = '';
        if (fileNameEl) fileNameEl.textContent = '未选择文件';
        
        if (!whiteboard.innerText.trim()) {
            whiteboard.innerHTML = '<p><br></p>';
        }
        
        if (typeof window.__wbSaveHistory === 'function') window.__wbSaveHistory();
        setTimeout(() => {
            if (typeof window.__wbResizeCanvas === 'function') window.__wbResizeCanvas();
        }, 100);
        
        alert('✅ 已清除白板上的 PPT 内容。');
    };
</script>

<script>
(function(){
 const $=id=>document.getElementById(id), SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 const panel=$('jwbyCaptionPanel'), historyKey='jwby_caption_history_v1';
 let running=false,paused=false,recognition=null,restartTimer=null,lastFinal='',queue=Promise.resolve(),drag=null;
 function status(value){$('jwbyCaptionStatus').textContent=value}
 function showPanel(){panel.hidden=false;$('jwbyCaptionRestore').hidden=true}
 function syncAuth(){if(window.jwbyIsAuthenticated?.())showPanel();else{panel.hidden=true;$('jwbyCaptionRestore').hidden=true}} syncAuth();document.addEventListener('jwby-static-authenticated',syncAuth);
 function updateButtons(){$('jwbyStart').disabled=running;$('jwbyStop').disabled=!running;$('jwbyPause').disabled=!running;$('jwbyPause').textContent=paused?'▶':'Ⅱ';$('jwbyPause').title=paused?'继续识别':'暂停识别';$('jwbySourceLanguage').disabled=running;$('jwbyProvider').disabled=running}
 function paintText(){const size=$('jwbyFontSize').value,color=$('jwbyFontColor').value;$('jwbyFontSizeValue').textContent=size;$('jwbySource').style.fontSize=$('jwbyTranslation').style.fontSize=size+'px';$('jwbySource').style.color='#f8fafc';$('jwbyTranslation').style.color=color}
 function paintPanel(){const hex=$('jwbyPanelColor').value,r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16),a=Number($('jwbyPanelOpacity').value)/100;panel.style.backgroundColor='rgba('+r+','+g+','+b+','+a+')';$('jwbyPanelOpacityValue').textContent=$('jwbyPanelOpacity').value+'%'}
 function getRecords(){try{return JSON.parse(localStorage.getItem(historyKey)||'[]')}catch{return []}}
 function drawHistory(){const box=$('jwbyCaptionHistoryList'),items=getRecords();box.replaceChildren();if(!items.length){box.textContent='暂无记录';return}for(const item of items){const row=document.createElement('div');row.className='jwby-caption-history-item';row.textContent='['+new Date(item.time).toLocaleString()+'] 原文：'+item.source+' ｜ 中文：'+item.translation;box.append(row)}}
 function remember(source,translation){const items=getRecords();items.unshift({time:new Date().toISOString(),source,translation});localStorage.setItem(historyKey,JSON.stringify(items.slice(0,100)));drawHistory()}
 async function translateWithModel(text,provider){
  const selector=$('modelProvider'),keyInput=$('apiKey');if(!selector||!keyInput||!keyInput.value.trim())throw new Error('请先在白板 AI 设置中填入 API Key；字幕不会自动切换模型。');
  const previous=selector.value;selector.value=provider;try{return await callAI(text,'请将以下内容翻译为简体中文。只返回译文，不要解释。',null,false)}finally{selector.value=previous}
 }
 async function translateWithProvider(text,provider){
  if(provider==='google'){const params=new URLSearchParams({client:'gtx',sl:'auto',tl:'zh-CN',dt:'t',q:text});const response=await fetch('https://translate.googleapis.com/translate_a/single?'+params.toString());if(!response.ok)throw new Error('Google 兼容接口 HTTP '+response.status);const data=await response.json(),translated=(data[0]||[]).map(part=>part[0]||'').join('').trim();if(!translated)throw new Error('Google 兼容接口没有返回译文');return translated}
  if(provider==='ollama'){const base=$('jwbyOllamaUrl').value.trim().replace(/\/+$/,'');const model=$('jwbyOllamaModel').value.trim();if(!base||!model)throw new Error('请填写 Ollama 服务地址和模型名');localStorage.setItem('jwby_ollama_url',base);localStorage.setItem('jwby_ollama_model',model);const response=await fetch(base+'/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model,prompt:'请将以下内容翻译为简体中文。只返回译文，不要解释。\n\n'+text,stream:false})});if(!response.ok)throw new Error('Ollama 接口 HTTP '+response.status+'；请检查服务地址和跨域设置');const data=await response.json();if(!data.response?.trim())throw new Error('Ollama 没有返回译文');return data.response.trim()}
  if(provider==='libretranslate'){const endpoint=$('jwbyLibreUrl').value.trim().replace(/\/+$/,'');if(!endpoint)throw new Error('请先在字幕设置中填写 LibreTranslate 服务地址');localStorage.setItem('jwby_libre_url',endpoint);const key=$('jwbyLibreKey').value.trim();const body={q:text,source:'auto',target:'zh',format:'text'};if(key)body.api_key=key;const response=await fetch(endpoint+'/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!response.ok)throw new Error('LibreTranslate 接口 HTTP '+response.status+'；请检查服务、密钥和跨域设置');const data=await response.json();if(!data.translatedText?.trim())throw new Error('LibreTranslate 没有返回译文');return data.translatedText.trim()}
  return translateWithModel(text,provider)
 }
 function translateFinal(source){
  const text=String(source||'').trim();if(!text||text===lastFinal)return;lastFinal=text;
  const provider=$('jwbyProvider').value;if(!provider){status('先选择翻译模型');return}
  queue=queue.then(async()=>{try{status('翻译中');const translated=await translateWithProvider(text,provider);$('jwbyTranslation').textContent=translated;remember(text,translated);status('识别中')}catch(error){status('翻译失败；未切换模型');console.warn('字幕翻译失败',error)}})
 }

  rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){status('请允许麦克风');stop(false)}else if(e.error!=='no-speech'&&e.error!=='aborted')status('识别错误：'+e.error)};
  rec.onend=()=>{recognition=null;if(running&&!paused)restartTimer=setTimeout(startRecognitionInstance,500);else updateButtons()};return rec
 }
 function startRecognitionInstance(){if(!running||paused)return;try{recognition=makeRecognition();recognition.start()}catch(error){status(error.message);running=false;updateButtons()}}
 function start(){if(running)return;if(!SpeechRecognition){status('浏览器不支持语音识别');return}if(!$('jwbyProvider').value){status('请先选择翻译模型');return}if(['deepseek','openai','claude','zhipu'].includes($('jwbyProvider').value)&&!$('apiKey')?.value.trim()){status('请先在白板 AI 设置中填写 API Key');return}running=true;paused=false;lastFinal='';updateButtons();status('请求麦克风权限');startRecognitionInstance()}
 function stop(show=true){running=false;paused=false;clearTimeout(restartTimer);const rec=recognition;recognition=null;if(rec){rec.onend=null;try{rec.stop()}catch{}}updateButtons();if(show)status('已停止')}
 function togglePause(){if(!running)return;if(!paused){paused=true;clearTimeout(restartTimer);const rec=recognition;recognition=null;if(rec){rec.onend=null;try{rec.stop()}catch{}}status('已暂停')}else{paused=false;startRecognitionInstance()}updateButtons()}
 $('jwbyStart').onclick=start;$('jwbyStop').onclick=()=>stop();$('jwbyPause').onclick=togglePause;$('jwbyClear').onclick=()=>{$('jwbySource').textContent='等待语音输入……';$('jwbyTranslation').textContent='等待翻译';lastFinal='';status('已清除')};
 $('jwbyClose').onclick=()=>{stop(false);panel.hidden=true;$('jwbyCaptionRestore').hidden=false};$('jwbyCaptionRestore').onclick=showPanel;
 $('jwbyRefreshHistory').onclick=drawHistory;$('jwbyClearHistory').onclick=()=>{if(confirm('清除本机字幕记录？')){localStorage.removeItem(historyKey);drawHistory()}};$('jwbyHistoryPop').addEventListener('toggle',()=>{if($('jwbyHistoryPop').open)drawHistory()});

 const savedSize=localStorage.getItem('jwby_caption_font_size'),savedTextColor=localStorage.getItem('jwby_caption_text_color'),savedBg=localStorage.getItem('jwby_caption_bg'),savedAlpha=localStorage.getItem('jwby_caption_alpha');
 if(savedSize)$('jwbyFontSize').value=savedSize;if(savedTextColor)$('jwbyFontColor').value=savedTextColor;if(savedBg)$('jwbyPanelColor').value=savedBg;if(savedAlpha)$('jwbyPanelOpacity').value=savedAlpha;
 $('jwbyFontSize').oninput=()=>{paintText();localStorage.setItem('jwby_caption_font_size',$('jwbyFontSize').value)};$('jwbyFontColor').oninput=()=>{paintText();localStorage.setItem('jwby_caption_text_color',$('jwbyFontColor').value)};$('jwbyPanelColor').oninput=()=>{paintPanel();localStorage.setItem('jwby_caption_bg',$('jwbyPanelColor').value)};$('jwbyPanelOpacity').oninput=()=>{paintPanel();localStorage.setItem('jwby_caption_alpha',$('jwbyPanelOpacity').value)};
 const handle=$('jwbyCaptionHeader');handle.addEventListener('pointerdown',e=>{if(e.target.closest('button,select,input,summary'))return;const rect=panel.getBoundingClientRect();drag={x:e.clientX-rect.left,y:e.clientY-rect.top};handle.setPointerCapture(e.pointerId);panel.style.transform='none';panel.style.left=rect.left+'px';panel.style.top=rect.top+'px'});handle.addEventListener('pointermove',e=>{if(!drag)return;panel.style.left=Math.max(0,Math.min(innerWidth-panel.offsetWidth,e.clientX-drag.x))+'px';panel.style.top=Math.max(0,Math.min(innerHeight-handle.offsetHeight,e.clientY-drag.y))+'px'});handle.addEventListener('pointerup',()=>drag=null);handle.addEventListener('pointercancel',()=>drag=null);
 paintText();paintPanel();updateButtons();drawHistory();
})();
